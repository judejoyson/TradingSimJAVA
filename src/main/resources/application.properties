spring.application.name=replaylab-trading-simulator

tradingsim.finnhub.base-url=https://finnhub.io/api/v1
tradingsim.finnhub.api-key=${FINNHUB_API_KEY:}
tradingsim.quote-cache-duration=PT10S
tradingsim.starting-cash=100000.00
tradingsim.security.require-https=${REQUIRE_HTTPS:false}

server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local development uses a file-backed embedded database so the application
# starts without installing PostgreSQL. Hosting activates the production profile.
spring.datasource.url=jdbc:h2:file:./data/replaylab;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Honor the original HTTPS scheme when a trusted reverse proxy terminates TLS.
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
